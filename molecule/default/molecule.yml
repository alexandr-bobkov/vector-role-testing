---
dependency:
  name: galaxy
driver:
  name: docker
platforms:
  - name: ubuntu-node
    image: ubuntu:latest
    privileged: true
    pre_build_image: true
    command: /bin/bash -c "while true; do sleep 3000; done"
    tmpfs:
      - /run
      - /tmp
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
  - name: oracle-node
    image: oraclelinux:8
    privileged: true
    pre_build_image: true
    command: /sbin/init
    tmpfs:
      - /run
      - /tmp
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
provisioner:
  name: ansible
  env:
    ANSIBLE_ALLOW_BROKEN_CONDITIONALS: "True"
verifier:
  name: ansible