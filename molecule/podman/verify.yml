---
- name: Verify
  hosts: all
  gather_facts: false
  tasks:
    - name: Check if Vector binary exists
      ansible.builtin.stat:
        path: /usr/bin/vector
      register: vector_bin

    - name: Assert that Vector binary is installed
      ansible.builtin.assert:
        that: vector_bin.stat.exists
        fail_msg: "Vector binary is missing!"

    - name: Validate Vector configuration
      ansible.builtin.command: /usr/bin/vector validate /etc/vector/vector.toml
      register: vector_validate_cmd
      changed_when: false
      failed_when: false

    - name: Assert that Vector configuration is valid
      ansible.builtin.assert:
        that: vector_validate_cmd.rc == 0
        fail_msg: "Vector configuration validation failed!"